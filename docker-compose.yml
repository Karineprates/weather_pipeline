version: "3.9"

services:
  # -----------------------------------------
  # MONGO DB
  # -----------------------------------------
  mongo:
    image: mongo:7
    container_name: weather_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u root -p root --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -----------------------------------------
  # RABBITMQ (com painel)
  # -----------------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: weather_rabbitmq
    hostname: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -----------------------------------------
  # API NESTJS
  # -----------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weather_api
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env.example
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: "on-failure:5"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -----------------------------------------
  # PYTHON PRODUCER (COLETA DE DADOS)
  # -----------------------------------------
  producer:
    build: ./python-producer
    container_name: weather_producer
    env_file:
      - ./python-producer/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "on-failure:5"
    command: [ "python", "/app/producer.py" ]

  # -----------------------------------------
  # WORKER GO
  # -----------------------------------------
  worker:
    build: ./worker-go
    container_name: weather_worker
    environment:
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672/
      API_URL: http://api:3000/api/weather/logs
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: weather_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
